AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-backup-route53

  Serverless Route53 Multi-Zone Backup Lambda

Parameters:
  BucketNamePrefix:
    Type: String
    Default: "" # Leave empty by default to fallback to Account ID
    Description: Optional human-friendly prefix fo rthe S3 backup bucket.
  BrandTag:
    Type: String
    Default: "Route53Backup"
    Description: Optional Brand tag Value
  FunctionTag: 
    Type: String
    Default: "Management"
    Description: Optional Function tag value
  ProjectTag: 
    Type: String
    Default: "Route53Backup"
    Description: Optional Function tag value
  BillingTag: 
    Type: String
    Default: "Infrastructure"
    Description: Optional Billing tag value

Conditions:
  # Check if the prefix is empty
  UseDefaultAccountName: !Equals [ !Ref BucketNamePrefix, "" ]

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      # If prefix is empty, use <AccountId>-backup-route53
      BucketName: !If
        - UseDefaultAccountName
        - !Sub "${AWS::AccountId}-backup-route53"
        - !Sub "${BucketNamePrefix}-backup-route53"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: BackupRetentionAndArchivalPolicy
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: DEEP_ARCHIVE
            ExpirationInDays: 1095 # 3 years 
      Tags: 
        - Key: Brand
          Value: !Ref BrandTag
        - Key: Function
          Value: !Ref FunctionTag
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Billing
          Value: !Ref BillingTag
  Route53BackupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: cron.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          BACKUP_BUCKET_NAME: !Ref BackupBucket
      Policies:
        - arn:aws:iam::aws:policy/AmazonRoute53ReadOnlyAccess
        - S3WritePolicy:
            BucketName: !Ref BackupBucket
      Events:
        DailyBackupSchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(38 1 * * ? *)'
            Description: Daily Route53 multi-zone backup trigger
      Tags: 
        Brand: !Ref BrandTag
        Function: !Ref FunctionTag
        Project: !Ref ProjectTag
        Billing: !Ref BillingTag
  Route53BackupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Route53BackupFunction}"
      RetentionInDays: 180

Outputs:
  BackupBucketName:
    Description: S3 Bucket storing the Route53 backups
    Value: !Ref BackupBucket